# Runs mybase: the control plane (API + dashboard), the shared Postgres server, Garage
# (S3-compatible storage), Valkey (Redis-compatible cache), and SearXNG (web search). All images are multi-arch (arm64 + amd64).
# Needs Docker Compose 2.23.1 or newer (for the inline Garage config below).
#
# Easiest: `mybase server setup` writes this file and its .env for you (keys, network, tunnel, start on boot):
#   curl -fsSL https://raw.githubusercontent.com/LandonHarter/mybase/master/scripts/install.sh | sh -s -- --setup
#
# By hand:
#   curl -fsSLO https://raw.githubusercontent.com/LandonHarter/mybase/master/docker/compose.yml
#   echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" > .env
#   echo "GARAGE_RPC_SECRET=$(openssl rand -hex 32)" >> .env
#   echo "GARAGE_ADMIN_TOKEN=$(openssl rand -hex 32)" >> .env
#   echo "VALKEY_PASSWORD=$(openssl rand -hex 32)" >> .env
#   echo "SEARXNG_SECRET=$(openssl rand -hex 32)" >> .env
#   echo "MYBASE_SECRETS_KEY=$(openssl rand -base64 32)" >> .env   # secrets service; back it up!
#   docker compose up -d
#
# Then open http://localhost:4000 (or set MYBASE_PORT in .env) and create the admin account.
# First-run setup only works from this machine or your LAN; or set MYBASE_ADMIN_PASSWORD in .env.
# Apps on other machines: set MYBASE_PUBLIC_HOST in .env to this machine's LAN/Tailscale name.
# Every service restarts with Docker (on boot, after crashes); MYBASE_RESTART=no turns that off.
#
# Public access (Cloudflare Tunnel, no router changes; the machine only needs outbound internet).
# `mybase server tunnel` does all of this, automatically with a Cloudflare API token. By hand:
#   1. Add your domain to Cloudflare (free plan) and switch its nameservers at your registrar.
#   2. Cloudflare Zero Trust → Networks → Tunnels → Create a tunnel (cloudflared). Copy its token.
#   3. In the tunnel's public hostnames, add:
#        mybase.<domain> → http://mybase:4000   (dashboard, API, public files, Postgres over WebSocket)
#        s3.<domain>     → http://garage:3900   (S3 for apps)
#   4. In .env:
#        COMPOSE_PROFILES=tunnel
#        CLOUDFLARE_TUNNEL_TOKEN=<token>
#        MYBASE_PUBLIC_URL=https://mybase.<domain>
#        MYBASE_S3_PUBLIC_URL=https://s3.<domain>
#        MYBASE_TRUST_PROXY=cloudflare
#      Optionally POSTGRES_BIND=127.0.0.1, GARAGE_S3_BIND=127.0.0.1, and VALKEY_BIND=127.0.0.1 to stop exposing those ports on the LAN.
#   5. docker compose up -d
# Apps on serverless hosts reach Postgres at wss://mybase.<domain>/db with @neondatabase/serverless,
# and the cache at https://mybase.<domain>/cache/<project> (@mybase-dev/sdk/cache or @upstash/redis).
# Cloudflare's free plan caps request bodies at 100 MB: bigger dashboard uploads only work on the LAN.
name: mybase

services:
  mybase:
    image: ${MYBASE_IMAGE:-ghcr.io/landonharter/mybase:latest}
    restart: ${MYBASE_RESTART:-unless-stopped}
    depends_on:
      postgres:
        condition: service_healthy
      # Garage's image has no shell for a healthcheck; the API waits for it on startup.
      garage:
        condition: service_started
      valkey:
        condition: service_healthy
      searxng:
        condition: service_started
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-mybase}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Where apps reach Postgres. Shown in each project's connection string.
      MYBASE_DB_PUBLIC_HOST: ${MYBASE_DB_PUBLIC_HOST:-${MYBASE_PUBLIC_HOST:-localhost}}
      MYBASE_DB_PUBLIC_PORT: ${POSTGRES_PORT:-5432}
      GARAGE_ADMIN_URL: http://garage:3903
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?set GARAGE_ADMIN_TOKEN in .env}
      GARAGE_S3_URL: http://garage:3900
      GARAGE_CAPACITY: ${GARAGE_CAPACITY:-100G}
      # Where apps reach storage (S3 endpoint) and public files (served by this API).
      MYBASE_S3_PUBLIC_URL: ${MYBASE_S3_PUBLIC_URL:-http://${MYBASE_PUBLIC_HOST:-localhost}:${GARAGE_S3_PORT:-3900}}
      MYBASE_PUBLIC_URL: ${MYBASE_PUBLIC_URL:-http://${MYBASE_PUBLIC_HOST:-localhost}:${MYBASE_PORT:-4000}}
      # Postgres over WebSocket, for apps that can't reach the Postgres port. Defaults to <MYBASE_PUBLIC_URL>/db.
      MYBASE_DB_WS_URL: ${MYBASE_DB_WS_URL:-}
      MYBASE_MAX_UPLOAD: ${MYBASE_MAX_UPLOAD:-1073741824}
      VALKEY_HOST: valkey
      VALKEY_PORT: 6379
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?set VALKEY_PASSWORD in .env}
      # Where apps reach the cache over TCP. Shown in each project's redis:// URL.
      MYBASE_CACHE_PUBLIC_HOST: ${MYBASE_CACHE_PUBLIC_HOST:-${MYBASE_PUBLIC_HOST:-localhost}}
      MYBASE_CACHE_PUBLIC_PORT: ${VALKEY_PORT:-6379}
      SEARXNG_URL: http://searxng:8080
      # Encrypts stored secrets (secrets service; it answers 503 without it). Keep a copy outside
      # this machine: if it's lost, stored secrets can't be recovered. To change it, move the old
      # one to MYBASE_SECRETS_KEY_OLD for one restart.
      MYBASE_SECRETS_KEY: ${MYBASE_SECRETS_KEY:-}
      MYBASE_SECRETS_KEY_OLD: ${MYBASE_SECRETS_KEY_OLD:-}
      # `cloudflare` when behind the tunnel: trusts CF-Connecting-IP for client IPs (login throttling).
      MYBASE_TRUST_PROXY: ${MYBASE_TRUST_PROXY:-}
      # Creates the admin account on first boot instead of the setup page. Ignored once it exists.
      MYBASE_ADMIN_USERNAME: ${MYBASE_ADMIN_USERNAME:-admin}
      MYBASE_ADMIN_PASSWORD: ${MYBASE_ADMIN_PASSWORD:-}
      # 1 for one restart turns the admin's 2FA off (lost phone and recovery codes).
      MYBASE_ADMIN_RESET_MFA: ${MYBASE_ADMIN_RESET_MFA:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${MYBASE_BIND:-0.0.0.0}:${MYBASE_PORT:-4000}:4000"

  # Official Postgres plus extensions projects can enable (see postgres.Dockerfile).
  # Upgrading from postgres:17-alpine: the data volume is compatible, but text sort order
  # changes (musl → glibc), so rebuild text indexes once, for each database:
  #   docker compose exec postgres psql -U mybase -d <db> -c 'reindex database <db>'
  postgres:
    image: ${MYBASE_POSTGRES_IMAGE:-ghcr.io/landonharter/mybase-postgres:17}
    restart: ${MYBASE_RESTART:-unless-stopped}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mybase}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # Apps connect to their project databases directly on this port.
    ports:
      - "${POSTGRES_BIND:-0.0.0.0}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # S3-compatible object storage: one bucket + key per project.
  garage:
    image: dxflrs/garage:v2.4.1
    restart: ${MYBASE_RESTART:-unless-stopped}
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET in .env}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?set GARAGE_ADMIN_TOKEN in .env}
    configs:
      - source: garage
        target: /etc/garage.toml
    # Apps use their bucket directly on this port. The admin API (3903) stays internal.
    ports:
      - "${GARAGE_S3_BIND:-0.0.0.0}:${GARAGE_S3_PORT:-3900}:3900"
    volumes:
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data

  # Redis-compatible cache: an ACL user per project (cache service), plus rate limit counters.
  # RAM only up to CACHE_MAXMEMORY, least recently used keys evicted first. Snapshots to disk at
  # most every 15 minutes (and on shutdown), to spare SD cards.
  valkey:
    image: valkey/valkey:8.1-alpine
    restart: ${MYBASE_RESTART:-unless-stopped}
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?set VALKEY_PASSWORD in .env}
    command: >-
      valkey-server --requirepass ${VALKEY_PASSWORD:?set VALKEY_PASSWORD in .env} --maxmemory ${CACHE_MAXMEMORY:-64mb}
      --maxmemory-policy allkeys-lru --save "900 1" --appendonly no
    # Apps use the cache directly on this port (over the LAN/Tailscale), as their project's user.
    ports:
      - "${VALKEY_BIND:-0.0.0.0}:${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$VALKEY_PASSWORD valkey-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Web search (search service): metasearch over Bing, Mojeek, Yahoo, DuckDuckGo, Brave, and a few
  # topic engines. Queries go out from this machine's IP; engines that rate-limit it are suspended
  # for a while and the rest keep answering. Only the API talks to it.
  searxng:
    image: searxng/searxng:2026.10.11-ad46ebd7d
    restart: ${MYBASE_RESTART:-unless-stopped}
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET in .env}
      GRANIAN_WORKERS: 1
      GRANIAN_BLOCKING_THREADS: 4
    configs:
      - source: searxng
        target: /etc/searxng/settings.yml

  # Cloudflare Tunnel: public HTTPS without opening router ports. Off unless COMPOSE_PROFILES=tunnel.
  # Hostnames are set up in the Cloudflare dashboard (see the top of this file).
  cloudflared:
    image: cloudflare/cloudflared:2026.10.4
    profiles: [tunnel]
    restart: ${MYBASE_RESTART:-unless-stopped}
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - mybase

configs:
  garage:
    content: |
      metadata_dir = "/var/lib/garage/meta"
      data_dir = "/var/lib/garage/data"
      db_engine = "lmdb"
      # Garage maps 1 TiB by default; Raspberry Pi kernels give processes only 512 GiB (39-bit VA).
      lmdb_map_size = "64G"
      replication_factor = 1
      rpc_bind_addr = "[::]:3901"
      rpc_public_addr = "127.0.0.1:3901"

      [s3_api]
      s3_region = "garage"
      api_bind_addr = "[::]:3900"

      [admin]
      api_bind_addr = "[::]:3903"

  searxng:
    content: |
      use_default_settings:
        engines:
          keep_only: [bing, mojeek, yahoo, duckduckgo, brave, wikipedia, github, stackoverflow, duckduckgo news, bing news]
      search:
        formats: [html, json]
      server:
        limiter: false
        image_proxy: false
      outgoing:
        request_timeout: 3.0
        max_request_timeout: 6.0
      engines:
        - name: bing
          disabled: false
        - name: mojeek
          inactive: false
        - name: yahoo
          disabled: false

volumes:
  postgres-data:
  garage-meta:
  garage-data:
  valkey-data:
