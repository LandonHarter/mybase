# Tests the CLI on every change to it, and releases it on the release tag (v*, same tag as sdk.yml
# and docker.yml):
#   git tag v1.0.0 && git push origin v1.0.0
# The tag must equal apps/cli/package.json, packages/sdk/package.json, and MYBASE_VERSION in
# packages/shared (all set by hand; CI only checks them). Publishes @mybase-dev/cli to npm via
# trusted publishing (OIDC, no token: npm trusts this file) and attaches CLI binaries to a GitHub
# release (scripts/install.sh downloads them).
name: cli

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths: ["apps/cli/**", "packages/shared/**", "packages/sdk/src/**", "docs/**", "scripts/gen-cli-docs.ts", ".github/workflows/cli.yml"]
  pull_request:
    paths: ["apps/cli/**", "packages/shared/**", "packages/sdk/src/**", "docs/**", "scripts/gen-cli-docs.ts", ".github/workflows/cli.yml"]
  workflow_dispatch:

permissions:
  contents: write # release assets
  id-token: write # npm trusted publishing + provenance

jobs:
  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cli
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun test apps/cli
        working-directory: .
      - run: bun run build

      - uses: actions/setup-node@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check versions match the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(node -p "require('./package.json').version")" = "$version"
          test "$(node -p "require('../../packages/sdk/package.json').version")" = "$version"
          grep -q "MYBASE_VERSION = \"$version\"" ../../packages/shared/src/index.ts

      - name: Build binaries
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64; do
            ext=""; [ "$target" = windows-x64 ] && ext=".exe"
            bun build src/index.ts --compile --minify --target="bun-$target" --outfile "dist/bin/mybase-$target$ext"
          done
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "$GITHUB_REF_NAME" dist/bin/* --title "mybase ${GITHUB_REF_NAME#v}" --generate-notes \
            --notes "Install the CLI: curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/master/scripts/install.sh | sh"
        env:
          GH_TOKEN: ${{ github.token }}

      # Skipped if this version is already on npm (a rerun).
      # The bundle has its workspace deps inlined; drop them so npm doesn't see workspace: specs.
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm view "@mybase-dev/cli@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1 || (npm pkg delete devDependencies && npm publish --access public)
