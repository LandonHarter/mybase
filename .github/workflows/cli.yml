# Tests the CLI on every change to it, and releases it on a tag:
#   git tag cli-v0.1.0 && git push origin cli-v0.1.0
# The tag's version must match apps/cli/package.json (and MYBASE_VERSION in packages/shared).
# A release attaches standalone binaries (scripts/install.sh downloads them) and publishes
# @mybase/cli to npm (needs the NPM_TOKEN secret, like sdk.yml).
name: cli

on:
  push:
    branches: [master]
    tags: ["cli-v*"]
    paths: ["apps/cli/**", "packages/shared/**", "packages/sdk/src/**", "docs/**", "scripts/gen-cli-docs.ts", ".github/workflows/cli.yml"]
  pull_request:
    paths: ["apps/cli/**", "packages/shared/**", "packages/sdk/src/**", "docs/**", "scripts/gen-cli-docs.ts", ".github/workflows/cli.yml"]
  workflow_dispatch:

permissions:
  contents: write # release assets
  id-token: write # npm provenance

jobs:
  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cli
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun test apps/cli
        working-directory: .
      - run: bun run build

      - name: Check versions match the tag
        if: startsWith(github.ref, 'refs/tags/cli-v')
        run: |
          test "cli-v$(bun -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
          grep -q "MYBASE_VERSION = \"$(bun -p "require('./package.json').version")\"" ../../packages/shared/src/index.ts

      - name: Build binaries
        if: startsWith(github.ref, 'refs/tags/cli-v')
        run: |
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64; do
            ext=""; [ "$target" = windows-x64 ] && ext=".exe"
            bun build src/index.ts --compile --minify --target="bun-$target" --outfile "dist/bin/mybase-$target$ext"
          done
      - name: Release
        if: startsWith(github.ref, 'refs/tags/cli-v')
        run: gh release create "$GITHUB_REF_NAME" dist/bin/* --title "CLI ${GITHUB_REF_NAME#cli-v}" --notes "Install: curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/master/scripts/install.sh | sh"
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/setup-node@v4
        if: startsWith(github.ref, 'refs/tags/cli-v')
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/cli-v')
        # The bundle has its workspace deps inlined; drop them so npm doesn't see workspace: specs.
        run: npm pkg delete devDependencies && npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
