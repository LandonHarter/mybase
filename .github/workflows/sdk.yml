# Tests @mybase/sdk on every change to it, and publishes it to npm on a tag:
#   git tag sdk-v0.1.0 && git push origin sdk-v0.1.0
# The tag's version must match packages/sdk/package.json. Needs an NPM_TOKEN secret
# (an npm automation token with publish rights to the @mybase scope).
name: sdk

on:
  push:
    branches: [master]
    tags: ["sdk-v*"]
    paths: ["packages/sdk/**", ".github/workflows/sdk.yml"]
  pull_request:
    paths: ["packages/sdk/**", ".github/workflows/sdk.yml"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun test
      - run: bun run build

      - uses: actions/setup-node@v4
        if: startsWith(github.ref, 'refs/tags/sdk-v')
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/sdk-v')
        run: test "sdk-v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/sdk-v')
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
