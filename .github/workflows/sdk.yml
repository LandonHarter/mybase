# Tests @mybase-dev/sdk on every change to it, and publishes it to npm on the release tag (v*,
# same tag as cli.yml). npm trusts this file for publishing. The tag must equal packages/sdk/package.json (set by hand).
name: sdk

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths: ["packages/sdk/**", ".github/workflows/sdk.yml"]
  pull_request:
    paths: ["packages/sdk/**", ".github/workflows/sdk.yml"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm trusted publishing + provenance

jobs:
  sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun test
      - run: bun run build

      - uses: actions/setup-node@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      # Skipped if this version is already on npm (a rerun).
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm view "@mybase-dev/sdk@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1 || npm publish --access public
