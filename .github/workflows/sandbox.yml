name: sandbox verification
on:
  pull_request:
    paths: ["apps/api/**", "apps/sandbox-worker/**", "packages/shared/**", "packages/sdk/**", "docker/sandbox*", "docker/sandbox/**", "scripts/test-sandbox*", "scripts/sandbox-test-helpers*", "examples/sandbox/**", ".github/workflows/sandbox.yml"]
  push:
    branches: [master]
    paths: ["apps/api/**", "apps/sandbox-worker/**", "docker/sandbox*", "docker/sandbox/**", "scripts/test-sandbox*", "scripts/sandbox-test-helpers*", "examples/sandbox/**", ".github/workflows/sandbox.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Install and register gVisor (ephemeral CI host only)
        working-directory: ${{ runner.temp }}
        run: |
          arch="$(uname -m)"
          url="https://storage.googleapis.com/gvisor/releases/release/latest/${arch}"
          curl --fail --silent --show-error --location --retry 3 -O "${url}/gvisor.tar.bz2"
          curl --fail --silent --show-error --location --retry 3 -O "${url}/gvisor.tar.bz2.sha512"
          sha512sum -c gvisor.tar.bz2.sha512
          # runsc requires gvisor-bin/ sidecars alongside it; install the complete release.
          sudo tar -xjf gvisor.tar.bz2 -C /usr/local/bin
          /usr/local/bin/runsc --version
          sudo /usr/local/bin/runsc install
          sudo systemctl restart docker
      - run: docker build -f docker/sandbox.Dockerfile -t mybase-sandbox:local .
      - run: bun test apps/sandbox-worker packages/sdk/src/sandbox.test.ts apps/api/src/sandbox.test.ts scripts/sandbox-test-helpers.test.ts
      - run: bun scripts/test-sandbox-runtime.ts
        timeout-minutes: 5
      - name: Build disposable control-plane dependencies
        run: |
          docker build -f docker/postgres.Dockerfile -t mybase-postgres:dev .
          docker pull dxflrs/garage:v2.4.1
          docker pull valkey/valkey:8.1-alpine
      - run: bun scripts/test-sandboxes.ts
